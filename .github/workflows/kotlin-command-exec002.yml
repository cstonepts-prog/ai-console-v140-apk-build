name: Kotlin Command EXEC002 Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - kotlin-command-exec002

permissions:
  contents: read

jobs:
  build-kotlin-command:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout isolated build branch
        uses: actions/checkout@v4

      - name: Reconstruct and verify exact source bundle
        shell: bash
        run: |
          set -euo pipefail
          cat kotlin-command-exec002/xz/part-* > /tmp/kotlin-command-source.b64
          base64 --decode /tmp/kotlin-command-source.b64 > /tmp/kotlin-command-source.tar.xz
          EXPECTED="$(awk '{print $1}' kotlin-command-exec002/XZ_SHA256)"
          ACTUAL="$(sha256sum /tmp/kotlin-command-source.tar.xz | awk '{print $1}')"
          echo "Expected source SHA-256: $EXPECTED"
          echo "Actual source SHA-256:   $ACTUAL"
          test "$EXPECTED" = "$ACTUAL"
          mkdir -p /tmp/kotlin-command-src
          tar -xJf /tmp/kotlin-command-source.tar.xz -C /tmp/kotlin-command-src
          test -f /tmp/kotlin-command-src/kotlin_command/settings.gradle.kts
          test -f /tmp/kotlin-command-src/kotlin_command/app/build.gradle.kts

      - name: Verify and apply EXEC002 build-2 remediation
        shell: bash
        run: |
          set -euo pipefail
          PATCH="$GITHUB_WORKSPACE/kotlin-command-exec002/patches/build2.patch"
          echo "84aa33df8b8f4f418068752bf760e9e72a2c166a4dbe808362a1d2eb075ee2d2  $PATCH" | sha256sum -c -
          cd /tmp/kotlin-command-src/kotlin_command
          patch -p1 < "$PATCH"

      - name: Verify and apply EXEC002 build-3 lint remediation
        shell: bash
        run: |
          set -euo pipefail
          PATCH="$GITHUB_WORKSPACE/kotlin-command-exec002/patches/build3.patch"
          echo "cc94da0be325dc64e92199b0fa05708afdbfd1638c62bfb0fe22a730fa007365  $PATCH" | sha256sum -c -
          cd /tmp/kotlin-command-src/kotlin_command
          patch -p1 < "$PATCH"

      - name: Verify and apply EXEC002 build-4 test remediation
        shell: bash
        run: |
          set -euo pipefail
          PATCH="$GITHUB_WORKSPACE/kotlin-command-exec002/patches/build4-tests.patch"
          echo "14ee409155ff2ad274305d92e6b3f09e6a1cbfec5cf41c4d7c55735861409759  $PATCH" | sha256sum -c -
          cd /tmp/kotlin-command-src/kotlin_command
          patch -p1 < "$PATCH"
          test -f app/src/test/java/com/nexarenew/aiconsole/domain/PureDomainTest.kt

      - name: Verify and apply EXEC002 build-5 DataStore remediation
        shell: bash
        run: |
          set -euo pipefail
          PATCH="$GITHUB_WORKSPACE/kotlin-command-exec002/patches/build5-datastore.patch"
          echo "f11094aacdd8857126d262b0f7fc85083a880b6674988ba9dac5a6bce243691a  $PATCH" | sha256sum -c -
          cd /tmp/kotlin-command-src/kotlin_command
          patch -p1 < "$PATCH"
          grep -F 'androidx.datastore:datastore-preferences:1.2.1' app/build.gradle.kts
          grep -F 'class AppPreferences' app/src/main/java/com/nexarenew/aiconsole/settings/AppPreferences.kt
          grep -F 'fun selectProvider(provider: ProviderId)' app/src/main/java/com/nexarenew/aiconsole/ui/AppViewModel.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36 and Build Tools 36.0.0
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Record toolchain evidence
        working-directory: /tmp/kotlin-command-src/kotlin_command
        shell: bash
        run: |
          set -euo pipefail
          java -version
          gradle --version
          sdkmanager --version
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"

      - name: Android unit tests
        working-directory: /tmp/kotlin-command-src/kotlin_command
        run: gradle --no-daemon --stacktrace testDebugUnitTest

      - name: Assert Android unit tests executed
        working-directory: /tmp/kotlin-command-src/kotlin_command
        shell: bash
        run: |
          set -euo pipefail
          RESULT="$(find app/build/test-results/testDebugUnitTest -type f -name '*.xml' -print -quit)"
          test -n "$RESULT"
          grep -Eq '<testsuite[^>]+tests="[1-9][0-9]*"' "$RESULT"
          echo "JUnit result: $RESULT"

      - name: Android lint
        working-directory: /tmp/kotlin-command-src/kotlin_command
        run: gradle --no-daemon --stacktrace lintDebug

      - name: Build debug APK
        working-directory: /tmp/kotlin-command-src/kotlin_command
        run: gradle --no-daemon --stacktrace clean assembleDebug

      - name: Verify APK identity, alignment, signature and checksum
        working-directory: /tmp/kotlin-command-src/kotlin_command
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          BT="$ANDROID_HOME/build-tools/36.0.0"
          test -s "$APK"
          "$BT/aapt" dump badging "$APK" | tee apk-badging.txt
          grep -F "package: name='com.nexarenew.aiconsole' versionCode='21' versionName='0.2.0-dev'" apk-badging.txt
          "$BT/zipalign" -c -v 4 "$APK"
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee apk-signing.txt
          sha256sum "$APK" | tee app-debug.apk.sha256
          mkdir -p "$GITHUB_WORKSPACE/kotlin-command-output"
          cp "$APK" "$GITHUB_WORKSPACE/kotlin-command-output/KotlinCommand-debug.apk"
          cp app-debug.apk.sha256 apk-badging.txt apk-signing.txt "$GITHUB_WORKSPACE/kotlin-command-output/"
          if [ -f app/build/reports/lint-results-debug.html ]; then cp app/build/reports/lint-results-debug.html "$GITHUB_WORKSPACE/kotlin-command-output/"; fi
          if [ -d app/build/test-results/testDebugUnitTest ]; then cp -R app/build/test-results/testDebugUnitTest "$GITHUB_WORKSPACE/kotlin-command-output/unit-test-results"; fi

      - name: Upload verified Kotlin Command APK
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-command-exec002-debug-apk
          path: kotlin-command-output/
          if-no-files-found: error
          retention-days: 30

      - name: Collect failure diagnostics
        if: failure()
        shell: bash
        run: |
          set +e
          mkdir -p kotlin-command-diagnostics
          cp -R /tmp/kotlin-command-src/kotlin_command/app/build/reports kotlin-command-diagnostics/ 2>/dev/null || true
          cp -R /tmp/kotlin-command-src/kotlin_command/app/build/outputs/logs kotlin-command-diagnostics/ 2>/dev/null || true
          cp -R /tmp/kotlin-command-src/kotlin_command/app/build/test-results kotlin-command-diagnostics/ 2>/dev/null || true

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-command-exec002-build-diagnostics
          path: kotlin-command-diagnostics/
          if-no-files-found: ignore
          retention-days: 14

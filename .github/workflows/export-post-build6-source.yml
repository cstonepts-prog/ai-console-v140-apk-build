name: Export post-build6 Kotlin source

on:
  push:
    branches:
      - kotlin-command-exec002
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Reconstruct and patch through build6
        shell: bash
        run: |
          set -euo pipefail
          cat kotlin-command-exec002/xz/part-* > /tmp/kotlin-command-source.b64
          base64 --decode /tmp/kotlin-command-source.b64 > /tmp/kotlin-command-source.tar.xz
          EXPECTED="$(awk '{print $1}' kotlin-command-exec002/XZ_SHA256)"
          ACTUAL="$(sha256sum /tmp/kotlin-command-source.tar.xz | awk '{print $1}')"
          test "$EXPECTED" = "$ACTUAL"
          mkdir -p /tmp/kotlin-command-src
          tar -xJf /tmp/kotlin-command-source.tar.xz -C /tmp/kotlin-command-src
          cd /tmp/kotlin-command-src/kotlin_command
          patch -p1 < "$GITHUB_WORKSPACE/kotlin-command-exec002/patches/build2.patch"
          patch -p1 < "$GITHUB_WORKSPACE/kotlin-command-exec002/patches/build3.patch"
          patch -p1 < "$GITHUB_WORKSPACE/kotlin-command-exec002/patches/build4-tests.patch"
          patch -p1 < "$GITHUB_WORKSPACE/kotlin-command-exec002/patches/build5-datastore-v2.patch"
          patch -p1 < "$GITHUB_WORKSPACE/kotlin-command-exec002/patches/build5-mainactivity-quote-fix.patch"
          B64="$GITHUB_WORKSPACE/kotlin-command-exec002/patches/build6-ai-controls-pause.patch.xz.b64"
          base64 --decode "$B64" > /tmp/build6.patch.xz
          echo "147ea389f202ac925832b482bc048994d0134fe1b8f5ac440cb56402e7ad2fd0  /tmp/build6.patch.xz" | sha256sum -c -
          xz --decompress --stdout /tmp/build6.patch.xz > /tmp/build6.patch
          echo "c7cc846029479ca617d8b52fcd724d99d1ce8b20d02334421fab197877602c0a  /tmp/build6.patch" | sha256sum -c -
          patch --dry-run -p1 < /tmp/build6.patch
          patch -p1 < /tmp/build6.patch
          grep -F 'fun pauseGeneration()' app/src/main/java/com/nexarenew/aiconsole/ui/AppViewModel.kt
          grep -F 'const val MAX_TOKENS = 1_048_576' app/src/main/java/com/nexarenew/aiconsole/domain/OutputTokenPolicy.kt

      - name: Upload post-build6 source
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-command-post-build6-source
          path: /tmp/kotlin-command-src/kotlin_command/
          if-no-files-found: error
          retention-days: 2

name: AI Console v1.4.2 EXEC002 R2 APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  JAVA_VERSION: '17'
  ANDROID_API_LEVEL: '36'
  ANDROID_BUILD_TOOLS_VERSION: '36.0.0'
  PACKAGE_NAME: com.nexarenew.aiconsole
  APP_VERSION: '1.4.2'
  VERSION_CODE: '11'
  APK_NAME: AI_Console_v1.4.2_EXEC002_R2_preview-release-signed.apk
  PAYLOAD_B85_SHA256: 7acd0f1e3aac322d2670de5dd042c29d580aa9c8bd107634acd5ee0a0b7c7d44
  PAYLOAD_XZ_SHA256: 529e6f197c0173188439f5c50009fac4e26f4b6193e7a1f2d7dca674768dad1d

jobs:
  build-apk-r2:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout build payload and runtime patch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Reconstruct verified EXEC002 source and apply startup hotfix
        shell: bash
        run: |
          set -euo pipefail
          cat build-input/part-*.b85 > /tmp/payload.b85
          echo "${PAYLOAD_B85_SHA256}  /tmp/payload.b85" | sha256sum -c -
          python3 - <<'PY'
          import base64, pathlib
          p=pathlib.Path('/tmp/payload.b85').read_bytes()
          pathlib.Path('/tmp/payload.tar.xz').write_bytes(base64.b85decode(p))
          PY
          echo "${PAYLOAD_XZ_SHA256}  /tmp/payload.tar.xz" | sha256sum -c -
          python3 - <<'PY'
          import pathlib, tarfile
          with tarfile.open('/tmp/payload.tar.xz','r:xz') as tf:
              for m in tf.getmembers():
                  n=m.name.replace('\\','/')
                  if n.startswith('/') or '..' in pathlib.PurePosixPath(n).parts:
                      raise SystemExit(f'unsafe archive member: {n}')
              tf.extractall('.')
          PY
          test -s App.js
          test -s package-lock.json
          test -f src/documents/pdfTextExtract.mjs
          cp runtime-patches/pdfTextExtract.mjs src/documents/pdfTextExtract.mjs
          if grep -Fq "TextDecoder('latin1')" src/documents/pdfTextExtract.mjs; then
            echo 'Unsupported React Native Latin-1 TextDecoder still present' >&2
            exit 1
          fi
          echo 'EXEC002_HERMES_LATIN1_HOTFIX=APPLIED' | tee hermes-latin1-hotfix.txt

      - name: Materialise v1.4.2 release configuration and assets
        shell: bash
        run: |
          set -euo pipefail
          cat > package.json <<'JSON'
          {
            "name": "ai-console",
            "version": "1.4.2",
            "private": true,
            "main": "index.js",
            "scripts": {
              "start": "expo start",
              "android": "expo run:android",
              "prebuild": "expo prebuild",
              "test": "node --test tests/*.test.mjs",
              "check": "node scripts/static-check.mjs"
            },
            "dependencies": {
              "@react-native-async-storage/async-storage": "2.2.0",
              "@react-native-community/slider": "5.2.0",
              "expo": "~57.0.15",
              "expo-clipboard": "~57.0.1",
              "expo-constants": "~57.0.13",
              "expo-document-picker": "~57.0.1",
              "expo-file-system": "~57.0.5",
              "expo-print": "~57.0.1",
              "expo-secure-store": "~57.0.1",
              "expo-sharing": "~57.0.14",
              "expo-speech-recognition": "^56.0.1",
              "expo-splash-screen": "~57.0.7",
              "expo-status-bar": "~57.0.1",
              "jszip": "^3.10.1",
              "react": "19.2.3",
              "react-native": "0.86.2",
              "react-native-safe-area-context": "~5.7.0",
              "react-native-svg": "15.15.4",
              "expo-image-picker": "57.0.12",
              "expo-speech": "57.0.1",
              "pako": "1.0.11"
            },
            "devDependencies": {
              "@babel/core": "^7.24.0",
              "babel-preset-expo": "~57.0.0"
            }
          }
          JSON
          cat > app.json <<'JSON'
          {
            "expo": {
              "name": "AI Console",
              "slug": "ai-console",
              "version": "1.4.2",
              "orientation": "default",
              "icon": "./assets/icon.png",
              "userInterfaceStyle": "light",
              "backgroundColor": "#f8fafc",
              "assetBundlePatterns": ["**/*"],
              "android": {
                "package": "com.nexarenew.aiconsole",
                "softwareKeyboardLayoutMode": "resize",
                "versionCode": 11,
                "adaptiveIcon": {
                  "foregroundImage": "./assets/adaptive-icon.png",
                  "backgroundColor": "#f8fafc"
                },
                "permissions": ["INTERNET"],
                "blockedPermissions": ["android.permission.SYSTEM_ALERT_WINDOW"]
              },
              "plugins": [
                ["expo-speech-recognition", {
                  "microphonePermission": "Allow AI Console to use your microphone for voice input.",
                  "speechRecognitionPermission": "Allow AI Console to convert your speech into text.",
                  "androidSpeechServicePackages": ["com.google.android.googlequicksearchbox", "com.google.android.tts"]
                }],
                ["expo-image-picker", {
                  "photosPermission": "Allow AI Console to select images for the active attachment session.",
                  "cameraPermission": "Allow AI Console to capture images for the active attachment session."
                }],
                "expo-secure-store",
                "expo-sharing",
                "expo-status-bar",
                ["expo-splash-screen", {
                  "backgroundColor": "#f8fafc",
                  "image": "./assets/splash.png",
                  "imageWidth": 200,
                  "resizeMode": "contain"
                }]
              ]
            }
          }
          JSON
          cat > babel.config.js <<'JS'
          module.exports = function (api) {
            api.cache(true);
            return { presets: ['babel-preset-expo'] };
          };
          JS
          cat > index.js <<'JS'
          import React, { useEffect, useState } from 'react';
          import { registerRootComponent } from 'expo';
          import { SafeAreaView, StyleSheet, Text, TouchableOpacity, View } from 'react-native';
          import AppErrorBoundary from './src/components/AppErrorBoundary';
          import { loadApplicationModule } from './src/startup/appLoader.mjs';
          function StartupErrorBoundary({ error, onRetry }) {
            if (!error) return null;
            return <SafeAreaView style={styles.root}><View style={styles.card} accessibilityRole="alert"><Text style={styles.title}>AI Console could not start safely.</Text><Text style={styles.body}>Typing-first recovery remains available. Your saved data has not been cleared. Retry startup; use CI/device diagnostics if the failure returns.</Text><TouchableOpacity style={styles.button} onPress={onRetry} accessibilityRole="button" accessibilityLabel="Retry AI Console startup"><Text style={styles.buttonText}>Retry startup</Text></TouchableOpacity></View></SafeAreaView>;
          }
          function Bootstrap(){const [AppComponent,setAppComponent]=useState(null);const [error,setError]=useState(null);const [attempt,setAttempt]=useState(0);useEffect(()=>{let active=true;setError(null);setAppComponent(null);void loadApplicationModule(()=>Promise.resolve().then(()=>require('./App'))).then(result=>{if(!active)return;if(result.ok)setAppComponent(()=>result.component);else setError(new Error(result.error));});return()=>{active=false;};},[attempt]);if(error)return <StartupErrorBoundary error={error} onRetry={()=>setAttempt(x=>x+1)}/>;if(!AppComponent)return <SafeAreaView style={styles.root}><Text style={styles.loading}>Opening AI Console…</Text></SafeAreaView>;return <AppErrorBoundary><AppComponent/></AppErrorBoundary>;}
          const styles=StyleSheet.create({root:{flex:1,backgroundColor:'#f8fafc',justifyContent:'center',padding:20},card:{borderRadius:18,borderWidth:1,borderColor:'#cbd5e1',backgroundColor:'#ffffff',padding:20},title:{color:'#0f172a',fontSize:20,fontWeight:'800',marginBottom:10},body:{color:'#475569',fontSize:14,lineHeight:21,marginBottom:18},button:{minHeight:48,borderRadius:14,alignItems:'center',justifyContent:'center',backgroundColor:'#0f819c',paddingHorizontal:18},buttonText:{color:'#fff',fontSize:14,fontWeight:'800'},loading:{color:'#334155',fontSize:15,textAlign:'center'}});
          registerRootComponent(Bootstrap);
          JS
          mkdir -p assets
          python3 - <<'PY'
          import struct,zlib,pathlib
          def png(path,w,h,rgb):
              sig=b'\x89PNG\r\n\x1a\n'
              def chunk(t,d):
                  return struct.pack('>I',len(d))+t+d+struct.pack('>I',zlib.crc32(t+d)&0xffffffff)
              raw=b''.join(b'\x00'+bytes(rgb)*w for _ in range(h))
              data=sig+chunk(b'IHDR',struct.pack('>IIBBBBB',w,h,8,2,0,0,0))+chunk(b'IDAT',zlib.compress(raw,9))+chunk(b'IEND',b'')
              pathlib.Path(path).write_bytes(data)
          png('assets/icon.png',1024,1024,(15,129,156))
          png('assets/adaptive-icon.png',1024,1024,(15,129,156))
          png('assets/splash.png',1024,1024,(248,250,252))
          png('assets/favicon.png',192,192,(15,129,156))
          PY
          node - <<'NODE'
          const app=require('./app.json').expo;
          if(app.version!=='1.4.2'||app.android.versionCode!==11||app.android.package!=='com.nexarenew.aiconsole') throw new Error('release identity mismatch');
          if(app.userInterfaceStyle!=='light') throw new Error('light-only contract mismatch');
          if(!app.android.blockedPermissions.includes('android.permission.SYSTEM_ALERT_WINDOW')) throw new Error('overlay permission block missing');
          console.log('Release identity contract PASS');
          NODE

      - name: Set up Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          packages: ''
          accept-android-sdk-licenses: true

      - name: Restore locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm ls expo react react-native expo-speech-recognition jszip --depth=0

      - name: Run EXEC002 regression and source contracts
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/*.test.mjs 2>&1 | tee npm-test.txt
          node scripts/static-check.mjs
          node scripts/ci-version-guard.mjs
          node scripts/verify-runtime-contract.mjs
          node --input-type=module - <<'NODE'
          import { bytesToLatin1 } from './src/documents/pdfTextExtract.mjs';
          const input=Uint8Array.from([0,65,127,128,255]);
          const output=bytesToLatin1(input);
          if(output.length!==input.length) throw new Error('Latin-1 byte length mismatch');
          const round=Array.from(output,c=>c.charCodeAt(0));
          if(round.some((v,i)=>v!==input[i])) throw new Error('Latin-1 byte-preserving decode mismatch');
          console.log('HERMES_LATIN1_REGRESSION_CONTRACT=PASS');
          NODE

      - name: Install Android 36 prerequisites
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-${ANDROID_API_LEVEL}" "build-tools;${ANDROID_BUILD_TOOLS_VERSION}"

      - name: Generate Android project
        shell: bash
        env:
          EXPO_NO_GIT_STATUS: '1'
        run: |
          set -euo pipefail
          npx expo prebuild --platform android --clean --no-install
          test -x android/gradlew || chmod +x android/gradlew

      - name: Build standalone release-mode APK
        shell: bash
        run: |
          set -euo pipefail
          (cd android && ./gradlew app:assembleRelease --no-daemon --max-workers=2 --stacktrace)
          APK_SOURCE="$(find android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -1)"
          test -n "$APK_SOURCE" && test -f "$APK_SOURCE"
          echo "APK_SOURCE=$APK_SOURCE" >> "$GITHUB_ENV"

      - name: Align and preview-sign APK
        shell: bash
        run: |
          set -euo pipefail
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/preview.jks" -storepass android -keypass android -alias preview -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=AI Console EXEC002 R2 Preview,OU=Preview,O=NexaRenew,C=GB" >/dev/null 2>&1
          "$ZIPALIGN" -f -p 4 "$APK_SOURCE" "$RUNNER_TEMP/aligned.apk"
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/preview.jks" --ks-pass pass:android --key-pass pass:android --ks-key-alias preview --out "$APK_NAME" "$RUNNER_TEMP/aligned.apk"
          "$APKSIGNER" verify --verbose --print-certs "$APK_NAME" | tee apk-signing.txt

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -1)"
          "$AAPT" dump badging "$APK_NAME" | tee apk-badging.txt
          grep -F "package: name='${PACKAGE_NAME}'" apk-badging.txt
          grep -F "versionName='${APP_VERSION}'" apk-badging.txt
          grep -F "versionCode='${VERSION_CODE}'" apk-badging.txt
          if "$AAPT" dump permissions "$APK_NAME" | grep -Fq 'android.permission.SYSTEM_ALERT_WINDOW'; then echo 'SYSTEM_ALERT_WINDOW unexpectedly present' >&2; exit 1; fi
          rm -rf apk-inspect && mkdir apk-inspect
          unzip -q "$APK_NAME" -d apk-inspect
          find apk-inspect -type f \( -name 'index.android.bundle' -o -name '*.hbc' -o -name '*.js' \) | grep -q .
          "$ZIPALIGN" -c -P 16 -v 4 "$APK_NAME" | tee apk-zipalign-16k.txt
          sha256sum "$APK_NAME" | tee "$APK_NAME.sha256"
          echo 'EXEC002_R2_APK_STATIC_VERIFICATION=PASS' | tee exec002-r2-apk-status.txt

      - name: Upload verified R2 APK artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: AI-Console-v1.4.2-EXEC002-R2-APK
          path: |
            AI_Console_v1.4.2_EXEC002_R2_preview-release-signed.apk
            AI_Console_v1.4.2_EXEC002_R2_preview-release-signed.apk.sha256
            apk-badging.txt
            apk-signing.txt
            apk-zipalign-16k.txt
            hermes-latin1-hotfix.txt
            npm-test.txt
            exec002-r2-apk-status.txt
          if-no-files-found: error
          retention-days: 30
